[project]
name = "hippo"
version = "1.0.0"
description = "A portable HippoRAG memory: an embedded graph database + Ollama + a friendly UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # LadybugDB, the embedded graph database (one file under data/). Pinned to 0.15.x: store/ladybug.py
    # works around two quirks of this binding version (see its docstring); check them before moving on.
    "real_ladybug>=0.15.3,<0.16",
    "igraph>=0.11",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "mcp>=2.0",
]

[project.optional-dependencies]
# HIPPO_STORE=neo4j: keep the graph in a Neo4j server instead of the embedded file.
neo4j = ["neo4j>=5.20"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyyaml>=6",
    "neo4j>=5.20",  # so the test suite can also run against a real Neo4j (CI does)
]

[project.scripts]
hippo = "hippo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hippo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/hippo/web/routes/*" = ["B008"]  # FastAPI's File(...) / Form(...) defaults are the normal idiom
