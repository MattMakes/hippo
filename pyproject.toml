[project]
name = "hippo"
version = "1.0.0"
description = "A portable HippoRAG memory: an embedded graph database + Ollama + a friendly UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # LadybugDB, the embedded graph database (one file under data/). Pinned to 0.15.x: store/ladybug.py
    # works around two quirks of this binding version (see its docstring); check them before moving on.
    "real_ladybug>=0.15.3,<0.16",
    "igraph>=0.11",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "mcp>=2.0",
    # The code graph: tree-sitter parses the five languages into symbols and calls,
    # sqlglot reads the SQL literals we turn into READS/WRITES edges (codegraph/).
    # Every grammar ships cp311/cp312 wheels for manylinux and macOS arm64, so the
    # Dockerfile needs nothing; the pins are the ABI ranges tree-sitter 0.26 accepts.
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-c-sharp>=0.23,<0.24",
    "tree-sitter-rust>=0.23,<0.25",
    "sqlglot>=27,<31",
]

[project.optional-dependencies]
# HIPPO_STORE=neo4j: keep the graph in a Neo4j server instead of the embedded file.
neo4j = ["neo4j>=5.20"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyyaml>=6",
    "neo4j>=5.20",  # so the test suite can also run against a real Neo4j (CI does)
]

[project.scripts]
hippo = "hippo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hippo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/fixtures/ holds checked-in source trees that the code-graph extractor parses. They are
# fixture data, not our tests: code_sample/tests/test_orders.py must never be collected. This is
# pytest's default list plus "fixtures" (setting the key replaces the default, it does not extend it).
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]

[tool.ruff]
line-length = 110
target-version = "py311"
# planning notes quote code verbatim, and tests/fixtures/ is a source tree whose exact bytes and
# line numbers are the spec (one-line suites, undefined names on purpose); neither is ours to reformat.
extend-exclude = ["docs/plans", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/hippo/web/routes/*" = ["B008"]  # FastAPI's File(...) / Form(...) defaults are the normal idiom
