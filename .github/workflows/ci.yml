# CI for hippo: lint, the unit tests on the embedded LadybugDB store (the default),
# the same tests on the in-memory fake, and once more against a real Neo4j (the
# `store` fixture switches on HIPPO_TEST_STORE / NEO4J_URI). Ollama is always
# faked: CI has no GPU and no time to pull models.

name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: unit tests (${{ matrix.store }} store) py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
        store: ["ladybug", "fake"]
    env:
      HIPPO_TEST_STORE: ${{ matrix.store }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  neo4j:
    name: unit tests against real Neo4j
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/hippo-password
        ports:
          - 7474:7474
          - 7687:7687
        # The job waits until this passes before the steps start.
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      HIPPO_TEST_STORE: neo4j
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: hippo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Same tests as the `unit` job; the store fixture now talks to the service container.
      - run: pytest tests/unit -q
