# hippo: three containers. `./hippo up` starts them for you (and decides whether
# the "ollama" service is needed); `docker compose up -d` works too.

services:
  # neo4j: the graph database where everything hippo remembers is stored.
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/hippo-password
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # the Neo4j browser (http://localhost:7474)
      - "7687:7687"   # bolt, what the app talks to
    volumes:
      - neo4j_data:/data
    healthcheck:
      # The browser port answers as soon as the database can take queries.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # app: the hippo web UI, API, MCP endpoint and CLI (built from this folder).
  app:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: hippo-password
      # ./hippo up sets OLLAMA_URL to the host's Ollama when it finds one; otherwise the ollama container.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      HIPPO_LLM_MODEL: ${HIPPO_LLM_MODEL:-qwen3:8b}
      HIPPO_EMBED_MODEL: ${HIPPO_EMBED_MODEL:-nomic-embed-text}
      HIPPO_DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # uploads and cloned repos survive container rebuilds
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach an Ollama running on your machine

  # ollama: a local model server, only started with `--profile ollama` (when your machine has no Ollama).
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama   # downloaded models (several GB) are kept between restarts

volumes:
  neo4j_data:
  ollama_data:
